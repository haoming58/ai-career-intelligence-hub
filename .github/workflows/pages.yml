name: Publish Career Hub

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
    - cron: '43 7 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation
        type: choice
        options:
          - publish
          - update
          - report
          - update-and-report
        default: publish

permissions: {}

concurrency:
  group: career-hub-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test
        run: |
          python -m unittest discover -s tests -v
          node --test tests/frontend.test.cjs
      - name: Collect public metadata
        if: github.event.schedule == '17 7 * * 1' || inputs.mode == 'update' || inputs.mode == 'update-and-report'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python hub.py update
      - name: Generate previous month report
        if: github.event_name == 'schedule' || inputs.mode == 'report' || inputs.mode == 'update-and-report'
        run: python hub.py report
      - name: Commit data and report history
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish')
        run: |
          git add -- data
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public intelligence and reports'
          git push origin HEAD:main
      - name: Build static site
        run: python hub.py build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
